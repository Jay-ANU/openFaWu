name: Fix openFaWu Codex bridge build (temporary)

on:
  push:
    branches:
      - "agent/legal-solo-foundation"
    paths:
      - ".github/workflows/fix-codex-frontend-temporary.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-solo-foundation
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply and verify fixes
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | xz -dc > /tmp/codex-fix.patch
          git apply --index /tmp/codex-fix.patch
          python -m compileall -q openfawu_codex_bridge
          python -m unittest discover -s openfawu_codex_bridge/tests -v
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build
          git diff --cached --check

          git config user.name "openFaWu Codex bridge bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: stabilize local Codex bridge and frontend build"
          git push origin HEAD:agent/legal-solo-foundation
