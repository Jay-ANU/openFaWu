name: Apply openFaWu local Codex bridge (temporary)

on:
  push:
    branches:
      - "agent/legal-solo-foundation"
    paths:
      - ".github/workflows/export-source-temporary.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-solo-foundation
          fetch-depth: 1
          persist-credentials: true

      - name: Apply local Codex bridge patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/openfawu/.codex-patch-01 \
            scripts/openfawu/.codex-patch-02 \
            scripts/openfawu/.codex-patch-03 \
            scripts/openfawu/.codex-patch-04-05 \
            scripts/openfawu/.codex-patch-06 \
            | base64 --decode > /tmp/openfawu-codex.patch.xz
          xz -dc /tmp/openfawu-codex.patch.xz > /tmp/openfawu-codex.patch
          git apply --index /tmp/openfawu-codex.patch
          git rm \
            scripts/openfawu/.codex-patch-01 \
            scripts/openfawu/.codex-patch-02 \
            scripts/openfawu/.codex-patch-03 \
            scripts/openfawu/.codex-patch-04-05 \
            scripts/openfawu/.codex-patch-06

          python3 -m compileall -q opencontractserver/legal_workspace openfawu_codex_bridge
          python3 -m unittest discover -s openfawu_codex_bridge/tests -v
          bash -n scripts/openfawu/codex-bridge-init.sh
          bash -n scripts/openfawu/codex-bridge-up.sh
          bash -n scripts/openfawu/codex-bridge-token.sh
          git diff --cached --check

          git config user.name "openFaWu Codex bridge bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: connect openFaWu to local Codex app-server"
          git push origin HEAD:agent/legal-solo-foundation
