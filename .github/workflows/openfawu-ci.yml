name: openFaWu contract review CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  contract-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate contract-review backend
        run: |
          python -m compileall -q \
            config/graphql/legal_review_api.py \
            opencontractserver/legal_workspace \
            openfawu_codex_bridge \
            scripts/openfawu/validate_foundation.py
          python -m unittest \
            opencontractserver.legal_workspace.tests.test_contract_text -v
          python -m unittest discover -s openfawu_codex_bridge/tests -v
          python scripts/openfawu/validate_foundation.py
          bash -n scripts/openfawu/codex-bridge-init.sh
          bash -n scripts/openfawu/codex-bridge-up.sh
          bash -n scripts/openfawu/codex-bridge-token.sh

      - name: Validate solo compose
        run: |
          mkdir -p .envs/.solo
          cp docs/sample_env_files/backend/local/.postgres .envs/.solo/.postgres
          cp docs/sample_env_files/backend/local/.django .envs/.solo/.django
          cp docs/sample_env_files/frontend/local/django.auth.env .envs/.solo/.frontend
          cp docs/sample_env_files/openfawu/solo.env.example .env.solo
          docker compose --env-file .env.solo -f solo.yml config --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build contract-review frontend
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build
