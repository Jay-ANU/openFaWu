name: Apply contract review refactor

on:
  push:
    branches:
      - "agent/legal-solo-foundation"
    paths:
      - ".github/workflows/export-source-contract-refactor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-solo-foundation
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply contract-review source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/openfawu/.contract-refactor-patch-00 \
            scripts/openfawu/.contract-refactor-patch-01 \
            scripts/openfawu/.contract-refactor-patch-02 \
            scripts/openfawu/.contract-refactor-patch-03 \
            | base64 --decode > /tmp/contract-refactor.patch.xz
          xz -dc /tmp/contract-refactor.patch.xz > /tmp/contract-refactor.patch
          git apply --index /tmp/contract-refactor.patch
          git rm \
            scripts/openfawu/.contract-refactor-patch-00 \
            scripts/openfawu/.contract-refactor-patch-01 \
            scripts/openfawu/.contract-refactor-patch-02 \
            scripts/openfawu/.contract-refactor-patch-03

      - name: Validate Python contract-review foundation
        run: |
          python -m compileall -q \
            config/graphql/legal_review_api.py \
            opencontractserver/legal_workspace \
            openfawu_codex_bridge \
            scripts/openfawu/validate_foundation.py
          python -m unittest \
            opencontractserver.legal_workspace.tests.test_contract_text -v
          python -m unittest discover -s openfawu_codex_bridge/tests -v
          python scripts/openfawu/validate_foundation.py
          bash -n scripts/openfawu/codex-bridge-init.sh
          bash -n scripts/openfawu/codex-bridge-up.sh
          bash -n scripts/openfawu/codex-bridge-token.sh

      - name: Validate solo compose
        run: |
          mkdir -p .envs/.solo
          cp docs/sample_env_files/backend/local/.postgres .envs/.solo/.postgres
          cp docs/sample_env_files/backend/local/.django .envs/.solo/.django
          cp docs/sample_env_files/frontend/local/django.auth.env .envs/.solo/.frontend
          cp docs/sample_env_files/openfawu/solo.env.example .env.solo
          docker compose --env-file .env.solo -f solo.yml config --quiet

      - name: Build contract-review frontend
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build

      - name: Commit verified refactor
        shell: bash
        run: |
          set -euo pipefail
          git restore frontend/public/env-config.js 2>/dev/null || true
          git diff --cached --check
          git config user.name "openFaWu contract review bot"
          git config user.email "actions@users.noreply.github.com"
          HUSKY=0 git commit -m "feat: refocus openFaWu on contract review"
          git push origin HEAD:agent/legal-solo-foundation
