name: Django runtime check (temporary)

on:
  push:
    branches:
      - "agent/legal-solo-foundation"
    paths:
      - ".github/workflows/backend-runtime-check-temporary.yml"

permissions:
  contents: read

jobs:
  django-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: openfawu-runtime-check-only
      DATABASE_URL: postgres://opencontractsuser:opencontractspass@127.0.0.1:5432/opencontractserver
      USE_AUTH0: "False"
      REDIS_URL: ""
      OPENAI_API_KEY: ""
      TELEMETRY_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      - name: Install backend runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt psycopg2-binary==2.9.12

      - name: Validate Django startup and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run legal_workspace
          python manage.py shell -c "from config.graphql.schema import schema; text=schema.as_str(); assert 'createContractReview' in text; assert 'legalReviewRun' in text; print('contract review GraphQL schema loaded')"
