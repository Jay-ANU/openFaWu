name: Apply contract review progress fix (temporary)

on:
  push:
    branches:
      - "agent/legal-solo-foundation"
    paths:
      - ".github/workflows/apply-review-progress-fix-temporary.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-solo-foundation
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply and verify progress fix
        run: |
          set -euo pipefail
          git apply --index scripts/openfawu/.review-progress-fix.patch
          git rm scripts/openfawu/.review-progress-fix.patch
          python -m compileall -q \
            config/graphql/legal_review_api.py \
            opencontractserver/legal_workspace/services/review_engine.py
          python -m unittest \
            opencontractserver.legal_workspace.tests.test_contract_text -v
          git diff --cached --check
          git config user.name "openFaWu contract review bot"
          git config user.email "actions@users.noreply.github.com"
          HUSKY=0 git commit -m "fix: expose contract review progress safely"
          git push origin HEAD:agent/legal-solo-foundation
