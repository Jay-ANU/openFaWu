name: Apply openFaWu legal solo foundation

on:
  push:
    branches:
      - "agent/legal-solo-foundation"
    paths:
      - ".github/workflows/apply-legal-solo-foundation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/legal-solo-foundation
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch upstream entry points
        run: python scripts/openfawu/patch_existing.py

      - name: Validate backend foundation
        run: |
          python -m compileall -q opencontractserver/legal_workspace
          python scripts/openfawu/validate_foundation.py

      - name: Validate solo compose
        run: |
          mkdir -p .envs/.solo
          cp docs/sample_env_files/backend/local/.postgres .envs/.solo/.postgres
          cp docs/sample_env_files/backend/local/.django .envs/.solo/.django
          cp docs/sample_env_files/frontend/local/django.auth.env .envs/.solo/.frontend
          cp docs/sample_env_files/openfawu/solo.env.example .env.solo
          docker compose --env-file .env.solo -f solo.yml config --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Finalize permanent CI and commit
        run: |
          mkdir -p .github/workflows
          cp scripts/openfawu/openfawu-ci.yml.template .github/workflows/openfawu-ci.yml
          git restore frontend/public/env-config.js 2>/dev/null || true
          rm -f scripts/openfawu/patch_existing.py
          rm -f scripts/openfawu/openfawu-ci.yml.template
          rm -f .github/workflows/apply-legal-solo-foundation.yml
          git config user.name "openFaWu foundation bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: establish single-user legal workspace foundation"
          git push origin HEAD:agent/legal-solo-foundation
